# Build the prebuilt Linux tarball and the portable Windows zip.
#
# - Pushing a tag `vX.Y.Z` builds both and attaches them, with SHA-256 sums,
#   to the GitHub release for that tag (creating the release if needed).
# - Pull requests that touch packaging or the build, and manual runs, only
#   build; the packages are kept as workflow artifacts for inspection.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "Cargo.toml"
      - "gui/Cargo.toml"
      - "gui/build.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with the toolchain used for local builds.
  RUST_TOOLCHAIN: "1.90.0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # An older LTS, so the binaries run on distributions with an older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$ver"; exit 1; }
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Test
        run: cargo test --release -p sector64 -p sector64-gui
      - name: Build package
        run: sh packaging/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    # Cross-compiled with MinGW-w64, exactly as packaging/build-windows.sh
    # does locally.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Build package
        run: sh packaging/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Sector64 ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
