[package]
name = "sector64"
version = "0.1.0"
edition = "2021"
description = "Clean-room reader for Commodore 1541 D64 disk images"
license = "MIT OR Apache-2.0"

# No external dependencies: the crate builds offline and has no supply chain.
[dependencies]

[[bin]]
name = "s64ls"
path = "src/bin/s64ls.rs"

[[bin]]
name = "s64extract"
path = "src/bin/s64extract.rs"

[[bin]]
name = "s64val"
path = "src/bin/s64val.rs"

[[bin]]
name = "s64write"
path = "src/bin/s64write.rs"

[profile.release]
overflow-checks = true  # keep arithmetic checks on even in release; this is a parser.
