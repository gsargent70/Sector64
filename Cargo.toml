[package]
name = "sector64"
version = "1.0.2"
edition = "2021"
description = "Clean-room reader for Commodore 1541 D64 disk images"
license = "MIT OR Apache-2.0"

# No external dependencies: the crate builds offline and has no supply chain.
[dependencies]

[[bin]]
name = "s64ls"
path = "src/bin/s64ls.rs"

[[bin]]
name = "s64extract"
path = "src/bin/s64extract.rs"

[[bin]]
name = "s64val"
path = "src/bin/s64val.rs"

[[bin]]
name = "s64write"
path = "src/bin/s64write.rs"

[[bin]]
name = "s64pack"
path = "src/bin/s64pack.rs"

[profile.release]
overflow-checks = true  # keep arithmetic checks on even in release; this is a parser.

# The core library/CLIs above stay dependency-free. The GUI front-end lives in
# a separate workspace member (`gui/`) so its dependency tree never touches the
# engine. `default-members` keeps a bare `cargo build`/`cargo test` building
# only the core; build the GUI explicitly with `-p sector64-gui`.
[workspace]
members = ["gui"]
default-members = ["."]
exclude = ["fuzz"]
