[package]
name = "sector64-gui"
version = "1.0.11"
edition = "2021"
description = "Native GUI for browsing Commodore disk images and archives"
license = "MIT OR Apache-2.0"

[dependencies]
sector64 = { path = ".." }
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
    # Linux windowing back-ends. `wayland` is also what applies the app id
    # ("sector64-gui") to the Wayland window, so the desktop matches it to
    # sector64.desktop and its icon; without it the window class is empty.
    "wayland",
    "x11",
] }
rfd = "0.15"

# Linux: the same winit eframe already uses (no new crates), named directly
# only to select the X11 back-end when SECTOR64_X11 is set. winit 0.30 has
# no drag-and-drop on Wayland; see main().
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[[bin]]
name = "sector64-gui"
path = "src/main.rs"

# On Windows, render through wgpu (Direct3D 12 / Vulkan) rather than OpenGL:
# Windows GL drivers are the least reliable path (VMs, Remote Desktop, older
# Intel drivers, Wine), and a missing GL pixel format aborts at startup.
# Linux keeps glow, so this adds nothing to the Linux dependency tree.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu"] }
