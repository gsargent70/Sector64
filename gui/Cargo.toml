[package]
name = "sector64-gui"
version = "1.0.0"
edition = "2021"
description = "Native GUI for browsing Commodore disk images and archives"
license = "MIT OR Apache-2.0"

[dependencies]
sector64 = { path = ".." }
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
] }
rfd = "0.15"

[[bin]]
name = "sector64-gui"
path = "src/main.rs"

# On Windows, render through wgpu (Direct3D 12 / Vulkan) rather than OpenGL:
# Windows GL drivers are the least reliable path (VMs, Remote Desktop, older
# Intel drivers, Wine), and a missing GL pixel format aborts at startup.
# Linux keeps glow, so this adds nothing to the Linux dependency tree.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu"] }
