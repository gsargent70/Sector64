[package]
name = "sector64-gui"
version = "0.1.0"
edition = "2021"
description = "Native GUI for browsing Commodore disk images and archives"
license = "MIT OR Apache-2.0"

[dependencies]
sector64 = { path = ".." }
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "persistence",
] }
rfd = "0.15"

[[bin]]
name = "sector64-gui"
path = "src/main.rs"
